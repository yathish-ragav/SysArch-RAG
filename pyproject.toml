[project]
name = "sysarch-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yathish Ragav", email = "yathishragav@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cohere>=5.15.0",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "langchain>=1.5.2",
    "langchain-cohere>=0.6.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.2.1",
    "langchain-text-splitters>=1.2.0",
    "langfuse>=5.2.0",
    "langgraph>=1.2.24",
    "langsmith>=0.16.2",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "qdrant-client>=1.20.0",
    "redis>=8.2.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ragas>=0.2.0",
    "datasets>=3.0.0",
]
