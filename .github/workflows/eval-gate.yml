name: CI - Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ci-placeholder
      COHERE_API_KEY: ci-placeholder
      LANGCHAIN_API_KEY: ci-placeholder
      LANGCHAIN_TRACING_V2: "false"
      LANGFUSE_PUBLIC_KEY: ci-placeholder
      LANGFUSE_SECRET_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -v

  ragas-gate:
    needs: unit-tests
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.13.4
        ports: ["6333:6333"]
      redis:
        image: redis:7.4.2-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Verify required secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ] || [ -z "$COHERE_API_KEY" ]; then
            echo "ERROR: Missing GROQ_API_KEY or COHERE_API_KEY in repository secrets."
            exit 1
          fi
      - name: Run RAGAS Quality Gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          QDRANT_URL: http://localhost:6333
          REDIS_URL: redis://localhost:6379
        run: uv run python -m src.evaluation.run_ragas
